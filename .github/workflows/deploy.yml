
name: Deploy AfterSchool Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: after-school-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: after-school-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue Frontend
        run: npm run build
        env:
          VITE_API_URL: https://m01022021-after-school.onrender.com

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./after-school-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
